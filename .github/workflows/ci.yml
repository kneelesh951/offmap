name: CI

# Runs on every pull request and every push to main.
# Catches TypeScript errors, lint issues, and broken builds
# before they reach staging or production.

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]

jobs:
  ci:
    name: Type check · Lint · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Run in mock mode — no real service keys needed in CI
      - name: Create mock .env for CI
        run: |
          cat > .env.local <<'EOF'
          MOCK_MODE=true
          NEXT_PUBLIC_APP_URL=http://localhost:3000
          NODE_ENV=test
          NEXT_PUBLIC_SUPABASE_URL=https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY=placeholder
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=placeholder
          SUPABASE_SERVICE_ROLE_KEY=placeholder
          DATABASE_URL=postgresql://placeholder
          STRIPE_SECRET_KEY=sk_test_placeholder
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=pk_test_placeholder
          STRIPE_WEBHOOK_SECRET=whsec_placeholder
          STRIPE_PRICE_DAY=price_placeholder
          STRIPE_PRICE_WEEK=price_placeholder
          STRIPE_PRICE_MONTH=price_placeholder
          STRIPE_PRICE_ANNUAL=price_placeholder
          UPSTASH_REDIS_REST_URL=https://placeholder.upstash.io
          UPSTASH_REDIS_REST_TOKEN=placeholder
          RESEND_API_KEY=re_placeholder
          RESEND_FROM_EMAIL=noreply@offmap.com
          RESEND_FROM_NAME=Offmap
          EOF
          # Strip leading spaces from heredoc
          sed -i 's/^[[:space:]]*//' .env.local

      - name: TypeScript check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
